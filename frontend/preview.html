<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--bg-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .preview-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
    </style>
</head>
<body>
    <div id="preview-content" class="preview-body">
        <div class="preview-placeholder">
            <p>プレビューを準備中...</p>
        </div>
    </div>

    <button id="btn-open-file" class="preview-action-btn" title="ファイルを既定のアプリで開く">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
    </button>

    <script>
        let currentFilePath = null;
        const openBtn = document.getElementById('btn-open-file');

        openBtn.onclick = () => {
            if (currentFilePath) {
                window.api.sendCommand('OPEN|' + currentFilePath);
                window.close();
            }
        };

        // メインプロセスからの指示を待機
        window.api.onBackendResponse((obj) => {
            if (obj.type === 'UPDATE_PREVIEW') {
                updatePreview(obj.file);
            } else if (obj.type === 'APPLY_THEME') {
                applyTheme(obj.theme, obj.isDark, obj.highContrast);
            }
        });

        const content = document.getElementById('preview-content');

        function applyTheme(theme, isDark, highContrast) {
            document.body.classList.remove('theme-deepblue', 'theme-khaki', 'theme-sakura', 'theme-amber', 'theme-sky', 'theme-midnight', 'light-mode', 'high-contrast');
            
            // カスタムスタイルのクリア
            const existingStyle = document.getElementById('custom-theme-styles');
            if (existingStyle) existingStyle.remove();

            if (!isDark) document.body.classList.add('light-mode');
            if (highContrast) document.body.classList.add('high-contrast');

            if (theme && theme.startsWith('custom-')) {
                const customData = localStorage.getItem('custom-theme-data');
                if (customData) {
                    const data = JSON.parse(customData);
                    const style = document.createElement('style');
                    style.id = 'custom-theme-styles';
                    let css = 'body { ';
                    if (data.colors) {
                        for (const [key, value] of Object.entries(data.colors)) {
                            css += `${key}: ${value} !important; `;
                        }
                    }
                    css += ' }';
                    style.textContent = css;
                    document.head.appendChild(style);
                }
            } else if (theme !== 'default' && theme !== 'snow') {
                document.body.classList.add(`theme-${theme}`);
            }
        }

        // 初期ロード時に即座にテーマを適用
        (function() {
            const theme = localStorage.getItem('app-theme') || 'default';
            const isDark = localStorage.getItem('isDarkMode') !== 'false';
            const highContrast = localStorage.getItem('settings-high-contrast') === 'true';
            applyTheme(theme, isDark, highContrast);
        })();

        async function updatePreview(file) {
            if (!file) {
                openBtn.classList.remove('visible');
                return;
            }

            currentFilePath = file.srcPath;
            openBtn.classList.add('visible');

            // スタイルの初期化（他ファイル形式と切り替わった際のPDF用スタイルをリセット）
            content.style.padding = '';
            content.style.height = '';
            content.style.justifyContent = 'flex-start';

            try {
                const ext = file.name.split('.').pop().toLowerCase();
                const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg', 'ico'].includes(ext);
                const isVideo = ['mp4', 'webm', 'ogg', 'mov', 'avi', 'mkv', 'wmv', 'flv'].includes(ext);
                const isPdf = ext === 'pdf';
                const isText = ['txt', 'js', 'json', 'c', 'cpp', 'h', 'hpp', 'py', 'md', 'html', 'css', 'sql', 'sh', 'bat', 'ps1'].includes(ext);

                if (isImage) {
                    const imgUrl = `file:///${file.srcPath.replace(/\\/g, '/')}`;
                    content.innerHTML = `
                        <div class="preview-image-container">
                            <img src="${imgUrl}" alt="Preview" />
                        </div>
                    `;
                } else if (isVideo) {
                    const videoUrl = `file:///${file.srcPath.replace(/\\/g, '/')}`;
                    content.innerHTML = `
                        <div class="preview-video-container" style="position: relative; display: flex; align-items: center; justify-content: center; height: 100%; width: 100%; background: #000;">
                            <video src="${videoUrl}" controls autoplay muted style="max-width: 100%; max-height: 100%;"></video>
                        </div>
                    `;
                } else if (isPdf) {
                    content.style.padding = '0';
                    content.style.height = '100%';
                    content.style.justifyContent = 'stretch';
                    const pdfUrl = `file:///${file.srcPath.replace(/\\/g, '/')}`;
                    content.innerHTML = `
                        <div class="preview-pdf-container" style="width: 100%; height: 100%; overflow: hidden; border-radius: 6px;">
                            <iframe src="${pdfUrl}" style="width: 100%; height: 100%; border: none;"></iframe>
                        </div>
                    `;
                } else if (isText) {
                    const text = await window.api.invoke('READ_FILE_TEXT', file.srcPath);
                    content.innerHTML = `
                        <div class="preview-text-container">${escapeHtml(text)}</div>
                    `;
                } else {
                    content.innerHTML = `
                        <div class="preview-info-card">
                            <div class="info-row">
                                <span class="info-label">名前</span>
                                <span class="info-value">${file.name}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">場所</span>
                                <span class="info-value">${file.srcPath}</span>
                            </div>
                            <p style="font-size: 11px; color: var(--text-muted); margin-top: 20px; text-align: center;">
                                このファイル形式のプレビューは現在サポートされていません
                            </p>
                        </div>
                    `;
                }
            } catch (err) {
                content.innerHTML = `<div class="preview-placeholder"><p style="color: var(--text-terminal-error)">エラー: ${err.message}</p></div>`;
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // キーイベントで閉じる & 動画スキップ
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === 'Escape') {
                e.preventDefault();
                window.close();
            } else {
                const videoEl = content.querySelector('video');
                if (videoEl) {
                    // スキップアニメーション用のCSS定義を注入
                    if (!document.getElementById('video-skip-animation-styles')) {
                        const style = document.createElement('style');
                        style.id = 'video-skip-animation-styles';
                        style.textContent = `
                            @keyframes skipFadeScale {
                                0% { opacity: 0; transform: scale(0.6); }
                                20% { opacity: 0.9; transform: scale(1.1); }
                                40% { opacity: 1; transform: scale(1.0); }
                                80% { opacity: 1; transform: scale(1.0); }
                                100% { opacity: 0; transform: scale(0.8); }
                            }
                            .video-skip-overlay {
                                position: absolute;
                                top: 0;
                                bottom: 0;
                                width: 40%;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                pointer-events: none;
                                z-index: 10;
                                background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 70%);
                            }
                            .video-skip-overlay.left {
                                left: 0;
                                border-top-left-radius: 6px;
                                border-bottom-left-radius: 6px;
                            }
                            .video-skip-overlay.right {
                                right: 0;
                                border-top-right-radius: 6px;
                                border-bottom-right-radius: 6px;
                            }
                            .video-skip-circle {
                                display: flex;
                                flex-direction: column;
                                align-items: center;
                                justify-content: center;
                                width: 80px;
                                height: 80px;
                                border-radius: 50%;
                                background: rgba(15, 15, 15, 0.75);
                                backdrop-filter: blur(8px);
                                -webkit-backdrop-filter: blur(8px);
                                border: 1px solid rgba(255, 255, 255, 0.15);
                                color: #ffffff;
                                box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
                                animation: skipFadeScale 0.75s ease-out forwards;
                            }
                            .video-skip-icon {
                                width: 28px;
                                height: 28px;
                                stroke-width: 2.5;
                                margin-bottom: 4px;
                                filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
                            }
                            .video-skip-text {
                                font-size: 13px;
                                font-weight: 700;
                                font-family: 'Outfit', 'Inter', sans-serif;
                                text-shadow: 0 2px 4px rgba(0,0,0,0.5);
                            }
                        `;
                        document.head.appendChild(style);
                    }

                    const showSkipOverlay = (container, direction) => {
                        container.querySelectorAll('.video-skip-overlay').forEach(el => el.remove());
                        const overlay = document.createElement('div');
                        overlay.className = `video-skip-overlay ${direction}`;
                        overlay.innerHTML = `
                            <div class="video-skip-circle">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="video-skip-icon">
                                    ${direction === 'left' 
                                        ? '<polygon points="11 19 2 12 11 5 11 19"></polygon><polygon points="22 19 13 12 22 5 22 19"></polygon>'
                                        : '<polygon points="13 19 22 12 13 5 13 19"></polygon><polygon points="2 19 11 12 2 5 2 19"></polygon>'
                                    }
                                </svg>
                                <span class="video-skip-text">${direction === 'left' ? '-10秒' : '+10秒'}</span>
                            </div>
                        `;
                        container.appendChild(overlay);
                        setTimeout(() => { overlay.remove(); }, 750);
                    };

                    if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        videoEl.currentTime = Math.max(0, videoEl.currentTime - 10);
                        const container = content.querySelector('.preview-video-container');
                        if (container) showSkipOverlay(container, 'left');
                    } else if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        videoEl.currentTime = Math.min(videoEl.duration || 0, videoEl.currentTime + 10);
                        const container = content.querySelector('.preview-video-container');
                        if (container) showSkipOverlay(container, 'right');
                    }
                }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--bg-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .preview-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="preview-content" class="preview-body">
        <div class="preview-placeholder">
            <p>プレビューを準備中...</p>
        </div>
    </div>

    <script>
        // メインプロセスからの指示を待機
        window.api.onBackendResponse((obj) => {
            if (obj.type === 'UPDATE_PREVIEW') {
                updatePreview(obj.file);
            } else if (obj.type === 'APPLY_THEME') {
                applyTheme(obj.theme, obj.isDark, obj.highContrast);
            }
        });

        const content = document.getElementById('preview-content');

        function applyTheme(theme, isDark, highContrast) {
            document.body.classList.remove('theme-deepblue', 'theme-khaki', 'theme-sakura', 'theme-amber', 'theme-sky', 'theme-midnight', 'light-mode', 'high-contrast');
            if (!isDark) document.body.classList.add('light-mode');
            if (theme !== 'default' && theme !== 'snow') document.body.classList.add(`theme-${theme}`);
            if (highContrast) document.body.classList.add('high-contrast');
        }

        async function updatePreview(file) {
            if (!file) return;

            try {
                const ext = file.name.split('.').pop().toLowerCase();
                const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'ico'].includes(ext);
                const isText = ['txt', 'js', 'json', 'c', 'cpp', 'h', 'hpp', 'py', 'md', 'html', 'css', 'sql', 'sh', 'bat', 'ps1'].includes(ext);

                if (isImage) {
                    const imgUrl = `file:///${file.srcPath.replace(/\\/g, '/')}`;
                    content.innerHTML = `
                        <div class="preview-image-container">
                            <img src="${imgUrl}" alt="Preview" />
                        </div>
                    `;
                } else if (isText) {
                    const text = await window.api.invoke('READ_FILE_TEXT', file.srcPath);
                    content.innerHTML = `
                        <div class="preview-text-container">${escapeHtml(text)}</div>
                    `;
                } else {
                    content.innerHTML = `
                        <div class="preview-info-card">
                            <div class="info-row">
                                <span class="info-label">名前</span>
                                <span class="info-value">${file.name}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">場所</span>
                                <span class="info-value">${file.srcPath}</span>
                            </div>
                        </div>
                    `;
                }
            } catch (err) {
                content.innerHTML = `<div class="preview-placeholder"><p style="color: var(--text-terminal-error)">エラー: ${err.message}</p></div>`;
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>

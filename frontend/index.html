<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JSON Filer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="toolbar">
            <input type="text" id="address-input" placeholder="Path...">
        </div>
        
        <div class="main-layout">
            <div class="file-pane">
                <table id="file-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Size</th>
                        </tr>
                    </thead>
                    <tbody id="file-list-body">
                    </tbody>
                </table>
            </div>
            
            <div class="terminal-pane">
                <div id="terminal-output"></div>
                <div class="input-area">
                    <span>></span>
                    <input type="text" id="terminal-input" placeholder="Command...">
                </div>
            </div>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>

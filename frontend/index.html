<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>fcmd</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <div class="toolbar">
            <div class="nav-buttons">
                <button id="btn-back" class="nav-btn" title="戻る">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6" />
                    </svg>
                </button>
                <button id="btn-forward" class="nav-btn" title="進む">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6" />
                    </svg>
                </button>
                <button id="btn-up" class="nav-btn" title="上のディレクトリへ">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="18 15 12 9 6 15" />
                    </svg>
                </button>
                <button id="btn-refresh" class="nav-btn" title="更新">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10" />
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                    </svg>
                </button>
            </div>
            <input type="text" id="address-input" placeholder="Path...">
            <div class="search-container">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input type="text" id="search-input" placeholder="検索...">
                </div>
                <div id="search-results" class="search-results" style="display:none;"></div>
            </div>
        </div>

        <div class="actions-bar">
            <div class="new-btn-wrapper">
                <button id="btn-new" class="action-btn" title="新規作成">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>新規作成</span>
                </button>
                <div id="new-menu" class="dropdown-menu">
                    <div class="menu-item" data-type="directory">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z">
                            </path>
                        </svg>
                        <span>ディレクトリ</span>
                    </div>
                    <div class="menu-item" data-type="text">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        <span>テキストファイル</span>
                    </div>
                    <div class="menu-item" data-type="other">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                        <span>その他ファイル</span>
                    </div>
                </div>
            </div>
            <div class="separator"></div>
            <button id="btn-cut" class="action-btn" title="切り取り">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="6" cy="6" r="3"></circle>
                    <circle cx="6" cy="18" r="3"></circle>
                    <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
                    <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
                    <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
                </svg>
            </button>
            <button id="btn-copy" class="action-btn" title="コピー">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            </button>
            <button id="btn-paste" class="action-btn" title="ペースト">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                    <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                </svg>
            </button>
            <button id="btn-rename" class="action-btn" title="名前変更">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
            </button>
            <button id="btn-delete" class="action-btn" title="削除">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
            </button>
            <div class="separator"></div>
            <div class="sort-btn-wrapper" style="position: relative;">
                <button id="btn-sort" class="action-btn" title="並べ替え">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 18H3M21 6H3M17 12H3"></path>
                    </svg>
                    <span>並べ替え</span>
                </button>
                <div id="sort-menu" class="dropdown-menu">
                    <div class="menu-item sort-item" data-sort-key="0"><span class="check-icon" style="opacity: 1;">✓</span>名前</div>
                    <div class="menu-item sort-item" data-sort-key="2"><span class="check-icon" style="opacity: 0;">✓</span>更新日時</div>
                    <div class="menu-item sort-item" data-sort-key="1"><span class="check-icon" style="opacity: 0;">✓</span>作成日時</div>
                    <div class="menu-item sort-item" data-sort-key="3"><span class="check-icon" style="opacity: 0;">✓</span>種類</div>
                    <div class="menu-item sort-item" data-sort-key="4"><span class="check-icon" style="opacity: 0;">✓</span>サイズ</div>
                    <div class="separator" style="width: 100%; height: 1px; margin: 4px 0; background: #444;"></div>
                    <div class="menu-item sort-order" data-sort-order="0"><span class="check-icon" style="opacity: 1;">✓</span>昇順</div>
                    <div class="menu-item sort-order" data-sort-order="1"><span class="check-icon" style="opacity: 0;">✓</span>降順</div>
                </div>
            </div>
            <div class="separator"></div>
            <div class="view-btn-wrapper" style="position: relative;">
                <button id="btn-view" class="action-btn" title="表示">
                    <span>表示</span>
                </button>
                <div id="view-menu" class="dropdown-menu">
                    <div class="menu-item view-mode" data-view-mode="extralarge"><span class="check-icon" style="opacity: 0;">✓</span>特大アイコン</div>
                    <div class="menu-item view-mode" data-view-mode="large"><span class="check-icon" style="opacity: 0;">✓</span>大アイコン</div>
                    <div class="menu-item view-mode" data-view-mode="medium"><span class="check-icon" style="opacity: 0;">✓</span>中アイコン</div>
                    <div class="menu-item view-mode" data-view-mode="small"><span class="check-icon" style="opacity: 0;">✓</span>小アイコン</div>
                    <div class="separator" style="width: 100%; height: 1px; margin: 4px 0; background: #444;"></div>
                    <div class="menu-item view-mode" data-view-mode="details"><span class="check-icon" style="opacity: 1;">✓</span>詳細</div>
                    <div class="menu-item view-mode" data-view-mode="compact"><span class="check-icon" style="opacity: 0;">✓</span>コンパクト</div>
                    <div class="separator" style="width: 100%; height: 1px; margin: 4px 0; background: #444;"></div>
                    <div class="menu-item has-submenu">
                        <span class="check-icon" style="opacity: 0;"></span>その他
                        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto; width:14px; height:14px;"><polyline points="9 18 15 12 9 6"></polyline></svg>
                        <div class="submenu dropdown-menu">
                            <div class="menu-item view-toggle" data-toggle="hidden"><span class="check-icon" style="opacity: 0;">✓</span>隠しファイル</div>
                            <div class="menu-item view-toggle" data-toggle="extension"><span class="check-icon" style="opacity: 1;">✓</span>ファイル名拡張子</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-layout">
            <div class="top-section">
                <div class="sidebar">
                    <div class="sidebar-title">FOLDERS</div>
                    <div id="tree-view" class="tree-view">
                        <!-- Tree items will be generated here -->
                    </div>
                </div>

                <div class="resizer-h" id="resizer-sidebar"></div>

                <div class="file-pane">
                    <table id="file-table">
                        <thead>
                            <tr>
                                <th style="width: 300px;">Name<div class="col-resizer"></div></th>
                                <th style="width: 150px;">Date Modified<div class="col-resizer"></div></th>
                                <th style="width: 150px;">Size<div class="col-resizer"></div></th>
                                <th class="filler-col"></th>
                            </tr>
                        </thead>
                        <tbody id="file-list-body">
                        </tbody>
                    </table>
                    <div id="file-grid" style="display: none;"></div>
                </div>
            </div>

            <div class="resizer-v" id="resizer-terminal"></div>

            <div class="terminal-pane">
                <div id="terminal-output"></div>
                <div class="input-area">
                    <span>></span>
                    <input type="text" id="terminal-input" placeholder="Command...">
                </div>
            </div>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>

</html>
